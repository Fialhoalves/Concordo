name: Release

# Publica uma nova versão sempre que o "version" do package.json subir e for para a main.
# Se a tag vX.Y.Z já existe, nada acontece. A tag é criada pela própria Release.
# (Enviar uma tag "v*" manualmente também continua funcionando.)
on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver se há versão nova
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A versão v$VERSION já foi publicada; nada a fazer."
          fi

      - if: steps.ver.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.ver.outputs.publish == 'true'
        name: Instalar dependências
        run: npm ci

      - if: steps.ver.outputs.publish == 'true'
        name: Rodar testes
        run: npm test

      # O túnel usa o cloudflared; embutimos o executável no instalador.
      - if: steps.ver.outputs.publish == 'true'
        name: Baixar cloudflared
        shell: bash
        run: |
          mkdir -p build/bin
          curl -fL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -o build/bin/cloudflared.exe
          ls -l build/bin

      # Gera o instalador, o .blockmap e o latest.yml (lido pela atualização automática).
      - if: steps.ver.outputs.publish == 'true'
        name: Gerar o instalador
        run: npx electron-builder --win --publish never

      - if: steps.ver.outputs.publish == 'true'
        name: Conferir os arquivos gerados
        shell: bash
        run: ls -l dist

      # O envio para a Release é feito por uma action própria, que falha se algum arquivo faltar.
      - if: steps.ver.outputs.publish == 'true'
        name: Publicar a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/Concordo-Setup-*.exe
            dist/Concordo-Setup-*.exe.blockmap
            dist/latest.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
